<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>pjt391</title>
<style>
  
  :root{
    --coral: #d97b73;
    --red: #e23b4e;
    --pink-light: #f6d9de;
    --pink-mid: #f0b8c2;
    --cream: #f4e9dd;
    --text: #5b2a2f;
  }

  *{ box-sizing: border-box; }

  body{
    margin:0;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    background:
      radial-gradient(circle at 20% 10%, #f7c8cf 0%, transparent 55%),
      radial-gradient(circle at 80% 90%, #f3d9ae 0%, transparent 50%),
      var(--cream);
    font-family: 'Courier New', monospace;
    overflow:hidden;
    position:relative;
  }

 
  .bg-heart{
    position:fixed;
    color: var(--red);
    opacity:.35;
    pointer-events:none;
    animation: float 9s ease-in-out infinite;
    user-select:none;
  }
  @keyframes float{
    0%,100%{ transform: translateY(0) rotate(0deg); }
    50%{ transform: translateY(-18px) rotate(8deg); }
  }

  .window{
    position:relative;
    width: 380px;
    max-width: 92vw;
    border: 5px solid var(--coral);
    border-radius: 12px;
    background: var(--pink-mid);
    box-shadow: 0 20px 50px rgba(90,30,40,.25);
    overflow:hidden;
    z-index: 2;
  }

  .titlebar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    background: var(--pink-light);
    border-bottom: 4px solid var(--coral);
    padding: 10px 14px;
  }
  .titlebar span{
    font-weight:bold;
    letter-spacing:2px;
    color: var(--text);
    font-size: 15px;
  }
  .dots{ display:flex; gap:6px; }
  .dots i{
    width:16px; height:16px;
    border: 2px solid var(--coral);
    border-radius: 4px;
    display:inline-block;
    background: var(--pink-light);
  }

  .hearts-strip{
    text-align:center;
    padding: 10px 0;
    background: var(--pink-light);
    color: var(--red);
    letter-spacing: 10px;
    font-size: 14px;
  }

  .content{
    background-image:
      linear-gradient(var(--pink-mid) 1px, transparent 1px),
      linear-gradient(90deg, var(--pink-mid) 1px, transparent 1px);
    background-size: 18px 18px;
    background-color: #f7c9d1;
    padding: 26px 20px 30px;
    text-align:center;
    position:relative;
    min-height: 380px;
  }

  .title{
    color: var(--text);
    font-size: 19px;
    margin: 0 0 14px;
    line-height:1.4;
  }

  canvas#cat{
    image-rendering: pixelated;
    margin: 6px auto 18px;
    display:block;
  }

  .btn-row{
    position:relative;
    display:flex;
    justify-content:center;
    gap: 22px;
    margin-top: 8px;
    height: 54px;
  }

  button{
    font-family: inherit;
    font-weight:bold;
    font-size: 15px;
    padding: 12px 26px;
    border-radius: 8px;
    cursor:pointer;
    color: var(--text);
    letter-spacing: 1px;
  }

  #yesBtn{
    background: #fdf0e6;
    border: 3px dashed var(--coral);
    transition: transform .15s ease;
  }
  #yesBtn:hover{ transform: scale(1.06); }
  #yesBtn:active{ transform: scale(.97); }

  #noBtn{
    background: #fdf0e6;
    border: 3px solid var(--coral);
    transition: left .18s ease, top .18s ease, transform .15s ease;
  }

  .footer-msg{
    margin-top: 18px;
    color: var(--text);
    font-size: 13px;
    opacity: .8;
  }

  .heart-pop{
    position: fixed;
    top: -10%;
    font-size: 22px;
    pointer-events:none;
    animation: fall linear forwards;
    z-index: 5;
  }
  @keyframes fall{
    to{ transform: translateY(115vh) rotate(360deg); opacity: 0; }
  }
</style>
</head>
<body>


<div id="ambient"></div>

<section class="window">
  <header class="titlebar">
    <span>Responde ai</span>
    <div class="dots"><i></i><i></i><i></i></div>
  </header>

  <div class="hearts-strip">♥ &nbsp; ♥ &nbsp; ♥</div>

  <div class="content">
    <h1 class="title" id="title">Você me ama??</h1>

    <canvas id="cat" width="120" height="110"></canvas>

    <div class="btn-row">
      <button id="yesBtn">SIM</button>
      <button id="noBtn">NÃO</button>
    </div>

    <p class="footer-msg" id="footerMsg">Tenta clicar no Não akakaakak</p>
  </div>
</section>

<script>

const ctx = document.getElementById('cat').getContext('2d');
const S = 6; 

const grid = [
"00011000000011000",
"00111100001111000",
"01111111111111100",
"11111111111111110",
"11122111111221110",
"11122111111221110",
"11111111111111110",
"11111133311111110",
"11111144444111110",
"11111444444111110",
"11111444444111110",
"11111144444111110",
"11111111411111110",
"11111111111111110",
"01111111111111100",
"00111111111111000",
];
const palette = { '1':'#1b1b1b', '2':'#ffffff', '3':'#f7b6c2', '4':'#e23b4e' };

function drawCat(bounce=0){
  const w = grid[0].length, h = grid.length;
  ctx.canvas.width = w*S;
  ctx.canvas.height = h*S + 6;
  ctx.clearRect(0,0,ctx.canvas.width, ctx.canvas.height);
  for(let y=0;y<h;y++){
    for(let x=0;x<w;x++){
      const c = grid[y][x];
      if(c==='0') continue;
      ctx.fillStyle = palette[c];
      ctx.fillRect(x*S, y*S + bounce, S, S);
    }
  }
}
drawCat();


let t = 0;
setInterval(()=>{
  t += 0.15;
  drawCat(Math.round(Math.sin(t)*2));
}, 90);


const ambient = document.getElementById('ambient');
for(let i=0;i<14;i++){
  const h = document.createElement('div');
  h.className = 'bg-heart';
  h.textContent = '♥';
  h.style.left = Math.random()*100 + 'vw';
  h.style.top = Math.random()*100 + 'vh';
  h.style.fontSize = (12 + Math.random()*18) + 'px';
  h.style.animationDelay = (Math.random()*6) + 's';
  h.style.animationDuration = (7 + Math.random()*6) + 's';
  ambient.appendChild(h);
}


const noBtn = document.getElementById('noBtn');
const yesBtn = document.getElementById('yesBtn');
const btnRow = document.querySelector('.btn-row');
const title = document.getElementById('title');
const footerMsg = document.getElementById('footerMsg');

let yesScale = 1;
let dodgeCount = 0;

const dodgeMessages = [
  "hmm, tentando fugir de mim? 😼",
  "não vai ser tão fácil assim...",
  "só clica em SIM logo 🥺",
  "o NÃO nem existe de verdade",
  "desiste, você me ama 😜"
];

function dodge(){
  const rowRect = btnRow.getBoundingClientRect();
  const btnRect = noBtn.getBoundingClientRect();

  const maxLeft = rowRect.width - btnRect.width;
  const maxTop = rowRect.height - btnRect.height;

  noBtn.style.position = 'absolute';
  noBtn.style.left = Math.max(0, Math.random() * maxLeft) + 'px';
  noBtn.style.top = Math.max(0, Math.random() * maxTop) + 'px';

  
  yesScale += 0.07;
  yesBtn.style.transform = `scale(${yesScale})`;

  dodgeCount++;
  footerMsg.textContent = dodgeMessages[Math.min(dodgeCount-1, dodgeMessages.length-1)];
}


noBtn.addEventListener('mouseenter', dodge);
noBtn.addEventListener('touchstart', (e)=>{ e.preventDefault(); dodge(); }, {passive:false});
noBtn.addEventListener('click', (e)=>{ e.preventDefault(); dodge(); });


yesBtn.onclick = () => {
  title.textContent = 'Nice kskssksk';
  footerMsg.textContent = 'eu sei, sou mt amável skskssk';
  noBtn.style.display = 'none';
  rainHearts();
};

function rainHearts(){
  const emojis = ['❤️','💛','💗','💖','💘'];
  for(let i=0;i<40;i++){
    setTimeout(()=>{
      const h = document.createElement('div');
      h.className = 'heart-pop';
      h.textContent = emojis[Math.floor(Math.random()*emojis.length)];
      h.style.left = Math.random()*100 + 'vw';
      h.style.animationDuration = (2.2 + Math.random()*2) + 's';
      h.style.fontSize = (16 + Math.random()*18) + 'px';
      document.body.appendChild(h);
      setTimeout(()=> h.remove(), 4500);
    }, i*60);
  }
}
</script>
</body>
</html>
